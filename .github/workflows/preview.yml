name: Preview (Vercel)

# Нужны секреты репозитория: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
# Без них workflow пропускается. Root Directory проекта в Vercel: apps/web.
on:
  pull_request:

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        id: secrets
        run: echo "ok=${{ secrets.VERCEL_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ok == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.secrets.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Deploy
        id: deploy
        if: steps.secrets.outputs.ok == 'true'
        run: |
          pnpm dlx vercel@latest pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
          pnpm dlx vercel@latest build --token=${{ secrets.VERCEL_TOKEN }}
          url=$(pnpm dlx vercel@latest deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Comment URL
        if: steps.secrets.outputs.ok == 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview
          message: "🚀 Preview: ${{ steps.deploy.outputs.url }}"
